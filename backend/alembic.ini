# TravelGraph AI — Alembic configuration.
#
# create_all (app.db.migrate) bootstraps the schema on startup; Alembic tracks revisions on top of
# it. The baseline revision 0001 creates the full schema from the current models, so both paths
# produce the same tables. For future changes:  alembic revision --autogenerate -m "describe change"
#
#   cd backend
#   ..\.venv\Scripts\alembic.exe upgrade head
#
# The database URL comes from DATABASE_URL / .env (see app.config), not from this file.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
